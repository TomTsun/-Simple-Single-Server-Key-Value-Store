services:
  proxy:
    build: 
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "8080:8080"
    depends_on:
      - kv-1
      - kv-2
      - kv-3

  kv-1:
    build: .
    volumes:
      - ./data/node1/data.json:/app/data.json
      - ./data/node1/logger.log:/app/logger.log

  kv-2:
    build: .
    volumes:
      - ./data/node2/data.json:/app/data.json
      - ./data/node2/logger.log:/app/logger.log

  kv-3:
    build: .
    volumes:
      - ./data/node3/data.json:/app/data.json
      - ./data/node3/logger.log:/app/logger.log